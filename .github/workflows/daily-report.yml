name: 每日热点选题报告

on:
  # 定时由外部 cron-job.org 触发（GitHub 自带 cron 不可靠，已弃用）。
  # cron-job.org 每天 北京时间 08:15 调用本 workflow 的 dispatch 接口来点火。
  workflow_dispatch: {}  # 保留手动触发入口，方便随时测试

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 计算 GitHub Pages 公网链接
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          echo "REPORT_PUBLIC_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}/" >> "$GITHUB_ENV"

      - name: 生成报告并推送企业微信
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: |
          python scripts/run_report.py --workdir .

      - name: 上传报告为 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: hot-topics-reports

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
