# 报告设置
# 说明：本配置 threshold 默认设为 0，即「不按分数硬过滤」，始终输出每个账号的 Top N 选题（由 max_topics 控制）。
# 原因：实时全国热榜与「黑龙江本地/文旅」赛道多数不直接命中，若硬卡 60 分会得到空报告。
#       报告内已按六维评分与综合评级清晰标注匹配强度，便于「借势」选题。
report_settings:
  output_dir: "./hot-topics-reports"
  max_topics: 10
  min_viral_score: 0
  include_suggestions: true
  language: "zh-CN"
  public_url: ""  # 云端由 workflow 的 REPORT_PUBLIC_URL 环境变量自动注入（GitHub Pages 地址）

# 推送设置（报告生成后自动推送到企业微信，通过群机器人 Webhook，完全免费、无需实名）
# 说明：enabled=true 时，run_report.py 会把报告摘要以 markdown 形式 POST 到企业微信群机器人 Webhook，消息进入该企业微信群。
# ⚠️ 云端版本：webhook 不写入本文件（公开仓库泄露风险）。
# 由 GitHub Actions 的 Secret「WECOM_WEBHOOK」通过环境变量注入，脚本会优先读取环境变量。
push:
  enabled: true
  type: "wecom"
  webhook: ""  # 留空，由环境变量 WECOM_WEBHOOK 注入
  top_n: 3
